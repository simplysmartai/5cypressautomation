<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">5 Cypress mark</title>
  <desc id="desc">A columnar cypress tree rising from a gold baseline.</desc>
  <defs>
    <linearGradient id="cypress" x1="32" y1="4" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BCB8F"/>
      <stop offset=".55" stop-color="#5D8C5D"/>
      <stop offset="1" stop-color="#2F6042"/>
    </linearGradient>
  </defs>

  <!-- Columnar cypress silhouette + trunk, one clean shape -->
  <path
    d="M32 4
       C 26 15, 21 23, 21 33
       C 21 41, 25 46, 29 49
       L 29 55 L 35 55 L 35 49
       C 39 46, 43 41, 43 33
       C 43 23, 38 15, 32 4 Z"
    fill="url(#cypress)"
  />

  <!-- Subtle gold baseline — the analytics axis the tree stands on -->
  <path
    d="M16 59 H48"
    fill="none"
    stroke="#FBBF24"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
